<!doctype html>
<html lang="ja">
  <head>

    <title>自己紹介ページ</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        line-height: 1.6;

    <div class="card">
      <h2>自己紹介</h2>
      <p>はじめまして。Web開発を学習中の、山田 太郎です。</p>
      <p>最近は HTML / CSS / JavaScript の基礎を楽しく勉強しています。</p>
    </div>

    <div class="card">
      <h2>趣味</h2>
      <ul>
        <li>読書</li>
        <li>カフェ巡り</li>
        <li>プログラミング</li>
      </ul>
    </div>
  </body>
</html>
